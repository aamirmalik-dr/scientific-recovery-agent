[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-recovery-agent"
version = "0.2.0"
description = "Workflow recovery agent for toy scientific computations: bounded log and config inspection, a finite patch allowlist, validation on a copy, approval-gated apply with revision checks, and rollback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aamir Malik" }]
keywords = ["llm-agents", "scientific-computing", "workflow-automation", "reliability", "hpc"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
scientific-recovery-agent = "scientific_recovery_agent.__main__:main"

[project.urls]
Repository = "https://github.com/aamirmalik-dr/scientific-recovery-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
