# Live pilot against an OpenAI-compatible endpoint (AGENT_MODEL_BASE_URL and
# AGENT_MODEL_API_KEY). The model is pinned here and overrides AGENT_MODEL_NAME.
# Held-out family only (10 incidents), two runs, all four arms.
# Frozen 2026-11-09 before the first held-out live episode.
mode: live
model: openai/gpt-4.1-mini        # via OpenRouter
families: [heldout]
arms: [rule_table, single_call, agent, agent_single_inspection]
runs: 2
episode:
  max_steps: 24
  max_tool_calls: 18
  max_tokens_per_episode: 80000   # prompt plus completion, per agent episode
  max_wall_seconds: 300
  recent_k: 4
  max_completion_tokens: 600
  single_inspection_reads: 1
run_caps:
  max_total_tokens: 3000000
  max_usd: 3.0                    # checked before every episode at the prices below
  usd_per_mtok_input: 0.40        # OpenRouter listed price, 2026-11-09
  usd_per_mtok_output: 1.60
output_dir: reports/live
record_timing: true
