# v2 live run B: second model on the same heldout_v2 family, one run.
# Arms: the agent, the strongest model-dependent baseline (single_call, tied 18/20
# with rule_table in v1) and rule_table (no model, free).
# Frozen 2026-11-09 before the first heldout_v2 live episode.
mode: live
model: anthropic/claude-sonnet-4.6   # via OpenRouter
families: [heldout_v2]
arms: [rule_table, single_call, agent]
runs: 1
episode:
  max_steps: 24
  max_tool_calls: 18
  max_tokens_per_episode: 80000
  max_wall_seconds: 300
  recent_k: 4
  max_completion_tokens: 600
  single_inspection_reads: 1
run_caps:
  max_total_tokens: 3000000
  max_usd: 0.90                   # checked before every episode at the prices below
  usd_per_mtok_input: 3.00        # OpenRouter listed price, 2026-11-09
  usd_per_mtok_output: 15.00
output_dir: reports/live_v2_sonnet
record_timing: true
# HTTP retry settings for transient errors (429, 5xx, timeouts); backoff doubles per retry.
# Added before the first run B episode, after HTTP 429 rate limits were seen on this model
# from parallel sessions; they change no prompt, cap or task.
adapter_max_retries: 6
adapter_backoff_s: 5.0
